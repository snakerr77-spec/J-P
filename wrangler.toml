name = "jp-recrutamento"
main = "worker/index.ts"
compatibility_date = "2026-09-24"

# Frontend (build gerado pelo Vite) servido como assets estáticos.
# O Worker roda em toda rota (run_worker_first = true) para poder aplicar os
# mesmos cabeçalhos de segurança (CSP, HSTS, etc.) no HTML/JS/CSS estático,
# não só nas respostas JSON da API; para rotas fora de /api/*, o Worker só
# repassa a requisição para o binding ASSETS (veja worker/index.ts).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Banco D1 — aponta para o banco "j-p" que já existe no projeto Cloudflare
# jp-credenciamento (mesmo id visto no painel), para reaproveitar os
# candidatos já cadastrados em vez de criar um banco novo vazio.
[[d1_databases]]
binding = "DB"
database_name = "j-p"
database_id = "ce55632e-9137-4a0c-a8ef-aa87256e3acc"

# Bucket R2 — mesmo bucket já usado pelo projeto jp-credenciamento, para
# reaproveitar os documentos já enviados pelos candidatos.
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "jp-credenciamento-documentos"

# MFA_ENABLED = "false": login/setup criam a sessão direto após a senha, sem
# exigir o código por e-mail. Pra religar o MFA (recomendado), troque para
# "true" — precisa ter RESEND_API_KEY configurada (wrangler secret put).
# MFA_FROM_EMAIL: remetente do e-mail de verificação quando o MFA estiver
# ligado. Troque pelo endereço que você verificar no Resend (veja README.md);
# até lá, o padrão abaixo só funciona em modo de teste.
[vars]
MFA_ENABLED = "false"
MFA_FROM_EMAIL = "J&P Recrutamento <onboarding@resend.dev>"

# AUTH_SECRET, RESEND_API_KEY etc. são segredos, não vars (não ficam em texto
# plano aqui no wrangler.toml):
# Local: copie .dev.vars.example para .dev.vars e defina os valores.
# Produção: `wrangler secret put AUTH_SECRET` e `wrangler secret put RESEND_API_KEY`.
