name: Publicar J&P no Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cloudflare-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar configuração do wrangler.toml
        run: |
          if grep -q "REPLACE_WITH_YOUR_D1_DATABASE_ID" wrangler.toml; then
            echo "::error::Defina o database_id real do banco D1 em wrangler.toml antes de publicar (veja README.md)."
            exit 1
          fi

      - name: Checar tipos (app, worker e vite config)
        run: npm run check

      - name: Gerar build do frontend
        run: npx vite build

      - name: Aplicar migrações pendentes do D1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply jp-recrutamento-db --remote

      - name: Publicar Worker (frontend + API)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
